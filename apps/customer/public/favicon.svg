<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- HomeCrew logomark: stylised house + wrench/tool -->
  <!-- Customer accent: teal #0e7490 -->
  <rect width="48" height="48" rx="10" fill="#0e7490"/>
  <!-- House body -->
  <polygon points="24,8 40,22 40,40 8,40 8,22" fill="#ffffff" opacity="0.95"/>
  <!-- Roof ridge line -->
  <polygon points="24,8 40,22 36,22 24,12 12,22 8,22" fill="#e29b38"/>
  <!-- Door -->
  <rect x="20" y="30" width="8" height="10" rx="1" fill="#0e7490"/>
  <!-- Tool mark (wrench head, bottom-right) -->
  <circle cx="33" cy="35" r="5" fill="#e29b38"/>
  <rect x="30" y="33" width="6" height="4" rx="1" fill="#0e7490"/>
</svg>
