<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Solid brand background with subtle modern radius, no purple, no gradient -->
  <rect width="64" height="64" rx="10" fill="#1b4f59" />
  
  <!-- Outer brand accent border -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#256673" stroke-width="2" />
  
  <!-- House rooftop symbol in warm terracotta -->
  <path d="M12 28 L32 12 L52 28 L47 32 L32 20 L17 32 Z" fill="#d94e38" />
  
  <!-- House base contour in clean crisp white -->
  <path d="M19 30 L19 50 L45 50 L45 30" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Service tool (wrench) symbol in gold inside house -->
  <path d="M29 32 L35 38 M35 38 L38 35 M32 29 C30 27 30 24 32 22 C34 20 37 20 39 22 L36 25 L39 28 L42 25 C44 27 44 30 42 32 C40 34 37 34 35 32 Z" fill="#e29b38" stroke="#1b4f59" stroke-width="1" />
  
  <!-- Verified service badge checkmark in corner -->
  <circle cx="47" cy="47" r="7" fill="#22c55e" />
  <path d="M44 47 L46 49 L50 45" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>